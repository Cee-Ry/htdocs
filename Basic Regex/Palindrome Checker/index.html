<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Palindrome Checker</h1>
    <p>Enter a word or phrase to see if it reads the same backward as forward.</p>
    <input type="text" id="text-input" placeholder="e.g., racecar or A man, a plan, a canal: Panama">
    <button id="check-btn">Check</button>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
